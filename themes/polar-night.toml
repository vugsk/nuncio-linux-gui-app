# Пример своей темы nuncio — «Полярная ночь» (в мотивах палитры Nord).
#
# Как подключить: Настройки → Внешний вид → Тема: «Из файла» → «Выбрать файл».
# После установки пакета примеры лежат в /usr/share/nuncio/themes/ — скопируйте
# файл к себе (например, в ~/.config/nuncio/) и правьте копию.
# Правки применяются на лету: сохранили файл — окно перекрасилось в течение
# секунды. Ошибки (неизвестный ключ, неверный цвет) видны там же, под файлом.
#
# Формат — TOML. Цвет: "#rrggbb" или "#rrggbbaa" (последняя пара — прозрачность,
# 00 — прозрачный, ff — непрозрачный). Ключи можно писать через _ или -.
#
# Все ключи необязательны: что не задано — берётся из основы (base).
# Самая короткая своя тема — основа и пара цветов:
#
#   base = "dark"
#   accent = "#8e44ad"
#   bubble_out = "#5b2c6f"

# Основа: "dark" (по умолчанию) или "light".
base = "dark"

# ── Окно и поверхности ──────────────────────────────────────────────────────
window_bg = "#2e3440"          # фон окна: лента сообщений, экраны входа и ошибок
card_bg = "#3b4252"            # карточки и панели: список чатов, шапка, меню, окна настроек
card_border = "#4c566a"        # рамки карточек, разделители
row_bg = "#3b4252"             # строка списка под курсором, фон вложенных блоков
row_selected = "#434c5e"       # выбранный чат в списке
strip_bg = "#3b4252"           # полосы и подложки: закреплённое, ячейки медиа без картинки

# ── Поля ввода ──────────────────────────────────────────────────────────────
field_bg = "#2e3440"           # фон поля ввода и поиска
field_border = "#4c566a"       # рамка поля
field_focus = "#88c0d0"        # рамка поля в фокусе

# ── Акцент (кнопки, выделение) ──────────────────────────────────────────────
accent = "#5e81ac"             # основные кнопки, активные вкладки, отметки
accent_border = "#88c0d0"      # рамка акцентных элементов
accent_hover = "#6a8fbd"       # акцентная кнопка под курсором
on_accent = "#eceff4"          # текст и значки на акцентном фоне

# ── Текст ───────────────────────────────────────────────────────────────────
text = "#eceff4"               # основной текст
text_muted = "#9aa5b8"         # второстепенный: время, подписи, подсказки
link = "#88c0d0"               # ссылки, имена в ответах, «Это устройство»
on_link = "#2e3440"            # текст на фоне цвета ссылки (значки файлов)
error = "#bf616a"              # ошибки, опасные действия («Удалить», «Выйти»)
success = "#a3be8c"            # успешное (проверка прокси)

# ── Сообщения ───────────────────────────────────────────────────────────────
bubble_in = "#3b4252"          # пузырь входящего
bubble_in_border = "#4c566a"   # его рамка
bubble_out = "#3e4f66"         # пузырь исходящего
bubble_out_border = "#81a1c1"  # его рамка
bubble_error = "#4a3438"       # пузырь неотправленного
reply_text = "#d8dee9"         # текст цитаты в ответе
mono_bg = "#eceff414"          # фон моноширинного кода в сообщении

# ── Опросы ──────────────────────────────────────────────────────────────────
poll_chosen = "#4c6a8a"        # выбранный вариант
poll_correct = "#4f6b4a"       # верный ответ викторины

# ── Мелкое ──────────────────────────────────────────────────────────────────
soft = "#eceff410"             # лёгкая подсветка под курсором
soft_strong = "#eceff420"      # подсветка посильнее (нажатие)
thumb = "#81a1c180"            # ползунок прокрутки
thumb_hover = "#81a1c1c0"      # ползунок под курсором
qr_bg = "#ffffff"              # фон QR-кода входа — оставьте белым, иначе телефон его не прочтёт

// Стык Rust (bridge) <-> Go (net/gen), см. Архитектура/nuncio - Границы и C ABI.md.
// Правится вручную; генерируется в net/gen (protoc-gen-go) и в Rust (prost,
// bridge/build.rs). Правила: номера полей не переиспользуются, только
// добавление; в этом файле нет ничего из TL.
//
// Команды и события добавляются по вехам (Архитектура/nuncio - План реализации.md):
// В0 — Ping; В3 — вход, прокси, список стран, состояние соединения;
// В4 — диалоги, история, отправка текста, обновления, аватары.

syntax = "proto3";

package nuncio.client.v0;

option go_package = "nuncio/net/gen;gen";

// Передаётся в nn_start один раз за процесс.
message StartRequest {
  // Должна совпасть с PROTO_VERSION на стороне Go, иначе nn_start вернёт ошибку.
  uint32 proto_version = 1;
  int32 api_id = 2;              // из ~/.config/nuncio/api.env (не из репозитория)
  string api_hash = 3;
  string data_dir = 4;           // ~/.local/share/nuncio: здесь session.bin
  string device_model = 5;
  string system_version = 6;
  string app_version = 7;
  string lang_code = 8;          // язык интерфейса: ru или en
  string system_lang_code = 9;
  bool test_servers = 10;        // тестовые серверы Telegram (запасной путь, Э-2 п. 7)
  ProxySettings proxy = 11;
  string log_dir = 12;           // ~/.local/state/nuncio: журнал Go (без секретов)
  string keyring_app = 13;       // имя записи в связке ключей; пусто = "nuncio"
  // Состояние обновлений из базы Rust (О-5); пусто — Go возьмёт updates.getState.
  UpdateState update_state = 14;
  string cache_dir = 15;         // ~/.cache/nuncio: аватары и медиа (пишет Go)
  repeated ChannelState channel_states = 16;  // pts каналов из базы Rust
}

// pts канала (у каждого канала и супергруппы свой поток обновлений).
message ChannelState {
  int64 peer_id = 1;             // помеченный id канала
  int32 pts = 2;
}

// Состояние обновлений (pts/qts/seq/date); Rust пишет его одной транзакцией с событиями.
message UpdateState {
  int32 pts = 1;
  int32 qts = 2;
  int32 seq = 3;
  int64 date = 4;
}

// Ссылка на собеседника для запросов. id «помеченный», как в Bot API:
// пользователь +id, группа -id, канал -(1000000000000 + id).
message PeerRef {
  int64 id = 1;
  int64 access_hash = 2;
}

message Peer {
  enum Kind {
    USER = 0;
    CHAT = 1;
    CHANNEL = 2;
  }
  int64 id = 1;
  Kind kind = 2;
  string name = 3;
  string username = 4;
  int64 access_hash = 5;
  int64 photo_id = 6;           // 0 — нет фото
  int32 photo_dc = 7;
  bool is_self = 8;
  bool is_bot = 9;
  bool broadcast = 10;          // канал (не группа)
  bool min = 11;                // неполные сведения: access_hash не годится для запросов
  bool contact = 12;            // в контактах (папки: «Контакты» / «Не контакты»)
}

message Message {
  int64 peer_id = 1;
  int32 id = 2;
  int64 date = 3;
  int64 from_id = 4;
  bool out = 5;
  string text = 6;
  int32 reply_to = 7;
  string media = 8;             // вид вложения: photo, document, ... (пусто — только текст)
  string service = 9;           // служебное сообщение: вид действия (пусто — обычное)
  int64 random_id = 10;         // для своих отправленных
  int64 edit_date = 11;
  int64 fwd_from_id = 12;        // «Переслано от» (Чт-3): помеченный id или 0
  string fwd_from_name = 13;     // имя, если id скрыт настройками приватности
  bool pinned = 14;
  repeated MessageEntity entities = 15;
  Media media_info = 16;         // вложение подробно (В7); media — только вид словом
  int64 grouped_id = 17;         // альбом: общий номер у сообщений одного альбома
}

// Вложение (Чт-7, Чт-11, Чт-13).
message Media {
  enum Kind {
    NONE = 0;
    PHOTO = 1;
    DOCUMENT = 2;
    VIDEO = 3;
    VOICE = 4;
    AUDIO = 5;
    STICKER = 6;
    GIF = 7;
    VIDEO_NOTE = 8;
    WEBPAGE = 9;
    POLL = 10;
    OTHER = 11;
  }
  Kind kind = 1;
  FileRef file = 2;              // фото — размер для ленты; документ — сам файл
  FileRef full = 3;              // фото — самый большой размер (окно просмотра)
  FileRef thumb = 4;             // превью документа (видео, картинка-файл)
  bytes stripped = 5;            // мини-превью JPEG: размытое до скачивания (Чт-11)
  int32 width = 6;
  int32 height = 7;
  int32 duration = 8;            // секунды
  string mime = 9;
  string name = 10;
  int64 size = 11;
  bytes waveform = 12;           // голосовое: 5-битные значения подряд
  string title = 13;             // аудио
  string performer = 14;
  string emoji = 15;             // стикер
  WebPage webpage = 16;
  Poll poll = 17;
}

// Ссылка на файл для upload.getFile.
message FileRef {
  enum Kind {
    PHOTO = 0;
    DOCUMENT = 1;
  }
  Kind kind = 1;
  int64 id = 2;
  int64 access_hash = 3;
  bytes file_reference = 4;
  int32 dc = 5;
  string thumb_size = 6;         // размер фото или превью документа; пусто — сам документ
  int64 size = 7;
}

message WebPage {
  string url = 1;
  string site = 2;
  string title = 3;
  string description = 4;
  FileRef photo = 5;
  bytes photo_stripped = 6;
  int32 photo_width = 7;
  int32 photo_height = 8;
}

message Poll {
  int64 id = 1;
  string question = 2;
  repeated PollOption options = 3;
  int32 total_voters = 4;
  bool closed = 5;
  bool multiple = 6;
  bool quiz = 7;
}

message PollOption {
  string text = 1;
  bytes option = 2;
  int32 voters = 3;
  bool chosen = 4;
  bool correct = 5;
}

// Форматирование текста (Дз-15). Смещения — в единицах UTF-16, как в Telegram.
message MessageEntity {
  enum Kind {
    OTHER = 0;
    BOLD = 1;
    ITALIC = 2;
    UNDERLINE = 3;
    STRIKE = 4;
    CODE = 5;
    PRE = 6;
    TEXT_URL = 7;   // ссылка под текстом: url
    URL = 8;        // ссылка — сам текст
    EMAIL = 9;
    MENTION = 10;
    HASHTAG = 11;
    SPOILER = 12;
    BLOCKQUOTE = 13;
  }
  Kind kind = 1;
  int32 offset = 2;
  int32 length = 3;
  string url = 4;
}

message Dialog {
  int32 pts = 8;                 // pts канала (для каналов и супергрупп)
  int64 peer_id = 1;
  int32 top_message = 2;
  int32 unread_count = 3;
  bool pinned = 4;
  int32 folder = 5;
  int32 read_inbox_max_id = 6;
  int32 read_outbox_max_id = 7;
  bool muted = 9;                // уведомления выключены
  bool unread_mark = 10;         // помечен непрочитанным вручную
}

// Папка (dialogFilter). Состав вычисляется по правилам над диалогами;
// id — помеченные. chatlist — папка по ссылке: только явные чаты.
message Folder {
  int32 id = 1;
  string title = 2;
  string emoticon = 3;
  bool chatlist = 4;
  bool contacts = 5;
  bool non_contacts = 6;
  bool groups = 7;
  bool broadcasts = 8;
  bool bots = 9;
  bool exclude_muted = 10;
  bool exclude_read = 11;
  bool exclude_archived = 12;
  repeated int64 pinned = 13;
  repeated int64 include = 14;
  repeated int64 exclude = 15;
}

// Сведения о чате для правой панели (Св-1).
message ChatInfo {
  int64 peer_id = 1;
  string about = 2;              // описание или «о себе»
  int32 members = 3;             // участников или подписчиков (0 — неизвестно)
  repeated Member participants = 4;  // для групп (первая страница)
  repeated Peer peers = 5;
  bool blocked = 6;
}

message Member {
  int64 user_id = 1;
  int32 role = 2;                // 0 участник, 1 администратор, 2 создатель
}

message DomainUpdate {
  oneof body {
    Message new_message = 1;
    Message edit_message = 2;
    DeleteMessages delete_messages = 3;
    ReadInbox read_inbox = 4;
    ReadOutbox read_outbox = 5;
    ResetDialogs reset = 6;      // разница слишком велика: перечитать диалоги
    ResetChannel reset_channel = 7;  // разница канала слишком велика: перечитать его историю
    Pinned pinned = 8;
    FoldersChanged folders_changed = 9;   // папки изменены: перечитать список папок
    PeerFolder peer_folder = 10;          // чат перенесён в архив или из архива
    PeerSettings peer_settings = 11;      // уведомления, закрепление, пометка непрочитанным
    ResetDialogs pinned_dialogs = 12;     // порядок закреплённых чатов изменился: перечитать диалоги
  }
}

message FoldersChanged {}
message PeerFolder { int64 peer_id = 1; int32 folder = 2; }
message PeerSettings {
  int64 peer_id = 1;
  // −1 — не менялось, 0 — нет, 1 — да.
  int32 muted = 2;
  int32 pinned = 3;
  int32 unread_mark = 4;
}

// Закреплено или откреплено (Чт-14), в том числе на другом устройстве.
message Pinned {
  int64 peer_id = 1;
  repeated int32 ids = 2;
  bool pinned = 3;
}

message ResetChannel {
  int64 peer_id = 1;
}

message DeleteMessages {
  int64 peer_id = 1;             // 0 — личные и группы (id сообщений общие для аккаунта)
  repeated int32 ids = 2;
}

message ReadInbox {
  int64 peer_id = 1;
  int32 max_id = 2;
  int32 still_unread = 3;        // −1 — неизвестно (своё «прочитано»): посчитать по базе
}

message ReadOutbox {
  int64 peer_id = 1;
  int32 max_id = 2;
}

message ResetDialogs {}

message UpdatesBatch {
  repeated DomainUpdate updates = 1;
  repeated Peer peers = 2;
  UpdateState state = 3;         // новое состояние: писать в той же транзакции
  repeated ChannelState channel_states = 4;  // изменившиеся pts каналов — в той же транзакции
}

message ProxySettings {
  enum Kind {
    NONE = 0;
    SOCKS5 = 1;
    MTPROXY = 2;
  }
  Kind kind = 1;
  string addr = 2;               // host:port
  string user = 3;               // SOCKS5
  string password = 4;           // SOCKS5
  string secret = 5;             // MTProxy
}

message Command {
  uint64 id = 1;          // корреляция с CommandResult.cmd_id
  uint64 account_id = 2;  // сейчас всегда 1
  oneof body {
    SendCode send_code = 10;
    SignIn sign_in = 11;
    CheckPassword check_password = 12;
    RequestQr request_qr = 13;
    LogOut log_out = 14;
    SignUp sign_up = 15;
    ResendCode resend_code = 16;
    CancelCode cancel_code = 17;
    SetProxy set_proxy = 60;
    TestProxy test_proxy = 61;
    GetCountries get_countries = 62;
    RetryStartup retry_startup = 63;
    LoadDialogs load_dialogs = 20;
    LoadHistory load_history = 21;
    SendMessage send_message = 30;
    MarkRead mark_read = 34;
    DownloadAvatar download_avatar = 53;
    EditMessage edit_message = 31;
    DeleteMessagesCmd delete_messages = 32;
    ForwardMessages forward = 33;
    PinMessage pin_message = 37;
    LoadPinned load_pinned = 38;
    LoadMessages load_messages = 39;
    GetContacts get_contacts = 41;
    SearchPeers search_peers = 42;
    LoadFolders load_folders = 43;
    SearchMessages search_messages = 44;
    GetChatInfo get_chat_info = 45;
    ChatAction chat_action = 46;
    UpdateFolder update_folder = 47;
    DownloadFile download_file = 54;
    CancelTransfer cancel_transfer = 55;
    SendVote send_vote = 56;
    Ping ping = 100;      // проверка связки Rust -> Go -> ядро, веха В0
  }
}

message SendCode { string phone = 1; }
message SignIn { string code = 1; }
message CheckPassword { string password = 1; }
message RequestQr {}
message LogOut {}
message SignUp { string first_name = 1; string last_name = 2; }
message ResendCode {}
message CancelCode {}
message SetProxy { ProxySettings proxy = 1; }   // для новых соединений; текущие переподключаются
message TestProxy { ProxySettings proxy = 1; }  // проверка без сохранения: обмен ключами и ping
message GetCountries { string lang_code = 1; }
message RetryStartup {}                          // «Повторить» на критическом экране (Со-4)

message LoadDialogs {
  int32 limit = 1;
  int64 offset_date = 2;         // страница после последнего полученного диалога
  int32 offset_id = 3;
  PeerRef offset_peer = 4;
}

message LoadHistory {
  PeerRef peer = 1;
  int32 offset_id = 2;           // 0 — с последнего сообщения
  int32 limit = 3;
  int32 add_offset = 4;
}

message SendMessage {
  PeerRef peer = 1;
  string text = 2;
  int64 random_id = 3;           // идемпотентность повтора (О-9)
  int32 reply_to = 4;
  repeated MessageEntity entities = 5;
}

message EditMessage {
  PeerRef peer = 1;
  int32 id = 2;
  string text = 3;
  repeated MessageEntity entities = 4;
}

// Удаление: в группах и личных чатах revoke — «удалить и у собеседника».
message DeleteMessagesCmd {
  PeerRef peer = 1;
  repeated int32 ids = 2;
  bool revoke = 3;
}

// Пересылка нескольким адресатам (Дз-16): random_id на каждое сообщение и адресата.
message ForwardMessages {
  PeerRef from_peer = 1;
  repeated int32 ids = 2;
  repeated ForwardTarget targets = 3;
}

message ForwardTarget {
  PeerRef peer = 1;
  repeated int64 random_ids = 2;
}

message PinMessage {
  PeerRef peer = 1;
  int32 id = 2;
  bool unpin = 3;
  bool silent = 4;
}

// Закреплённые сообщения чата (Чт-14): последние сверху.
message LoadPinned {
  PeerRef peer = 1;
  int32 limit = 2;
}

// Отдельные сообщения по id (цитаты ответов, переход к закреплённому).
message LoadMessages {
  PeerRef peer = 1;
  repeated int32 ids = 2;
}

message GetContacts {}

// Поиск людей и чатов по имени и username (диалог выбора, Дз-16).
message SearchPeers {
  string query = 1;
  int32 limit = 2;
}

message MarkRead {
  PeerRef peer = 1;
  int32 max_id = 2;
}

message DownloadAvatar {
  PeerRef peer = 1;
  int64 photo_id = 2;
  int32 dc = 3;
}

message Event {
  oneof body {
    CommandResult result = 1;
    ConnectionState connection = 2;
    AuthState auth = 3;
    UpdatesBatch updates = 4;
    FatalError fatal = 6;
    StartupError startup = 7;
    TransferProgress transfer = 8;
  }
}

// Ход передачи файла (скачивание или выгрузка): id — команды, которая её начала.
message TransferProgress {
  uint64 cmd_id = 1;
  int64 done = 2;
  int64 total = 3;               // 0 — размер неизвестен
}

message ConnectionState {
  enum State {
    STATE_UNSPECIFIED = 0;
    CONNECTING = 1;
    CONNECTED = 2;
    WAITING_NETWORK = 3;
  }
  State state = 1;
}

message AuthState {
  enum Step {
    STEP_UNSPECIFIED = 0;
    QR = 1;
    CODE = 2;
    PASSWORD = 3;
    SIGN_UP = 4;
    READY = 5;
    LOGGED_OUT = 6;
  }
  Step step = 1;
  string qr_url = 2;
  int64 qr_expires_unix = 3;
  CodeInfo code = 4;
  string password_hint = 5;
  bool has_recovery = 6;
  string terms = 7;
  User user = 8;
  // LOGGED_OUT: logged_out, session_ended, keyring_no_key, session_broken или пусто.
  string reason = 9;
}

message CodeInfo {
  string kind = 1;       // app, sms, call, flash_call, missed_call, email, fragment, other
  uint32 length = 2;
  string next_kind = 3;
  uint32 timeout = 4;
}

message User {
  int64 id = 1;
  string first_name = 2;
  string last_name = 3;
  string username = 4;
}

// Критическая ошибка старта (Со-4): экран с «Повторить» и «Выйти».
message StartupError {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KEYRING_UNAVAILABLE = 1;  // нет Secret Service (О-6)
    KEYRING_DISMISSED = 2;    // пользователь не разблокировал связку
    CONFIG = 3;               // нет api_id/api_hash или неверные параметры
    OTHER = 4;
  }
  Kind kind = 1;
  string text = 2;
}

message CommandResult {
  uint64 cmd_id = 1;
  Error error = 2;        // не задано = успех
  oneof payload {
    Pong pong = 100;
    Countries countries = 101;
    ProxyCheck proxy_check = 102;
    Dialogs dialogs = 103;
    History history = 104;
    Sent sent = 105;
    FilePath file = 106;
    PeerList peers = 107;
    FolderList folders = 108;
    ChatInfo chat_info = 109;
  }
}

message FolderList { repeated Folder folders = 1; }

message LoadFolders {}

// Поиск сообщений: без peer — по всем чатам на сервере (messages.searchGlobal),
// с peer — в чате (messages.search) с фильтрами (Дз-18).
message SearchMessages {
  enum Filter {
    ALL = 0;
    MEDIA = 1;     // фото и видео
    FILES = 2;
    LINKS = 3;
    VOICE = 4;
  }
  PeerRef peer = 1;
  string query = 2;
  Filter filter = 3;
  int64 min_date = 4;
  int64 max_date = 5;
  PeerRef from = 6;
  int32 offset_id = 7;
  int32 limit = 8;
  // Глобальный поиск: продолжение страниц.
  int32 offset_rate = 9;
  PeerRef offset_peer = 10;
}

message GetChatInfo { PeerRef peer = 1; string members_query = 2; }

// Скачать файл в кэш (результат — FilePath). Прогресс — события TransferProgress.
// peer и msg_id — чтобы обновить ссылку на файл, если она устарела.
message DownloadFile {
  FileRef file = 1;
  string name = 2;               // имя файла для расширения (документы)
  PeerRef peer = 3;
  int32 msg_id = 4;
}

message CancelTransfer { uint64 cmd_id = 1; }

message SendVote { PeerRef peer = 1; int32 msg_id = 2; repeated bytes options = 3; }

// Изменить папку (пункт «В папку…», Сп-4): папка целиком и ссылки на все её чаты.
message UpdateFolder { Folder folder = 1; repeated PeerRef peers = 2; }

// Действия над чатом (Сп-4, Св-1).
message ChatAction {
  enum Kind {
    MUTE = 0;
    UNMUTE = 1;
    ARCHIVE = 2;
    UNARCHIVE = 3;
    PIN = 4;
    UNPIN = 5;
    MARK_UNREAD = 6;
    CLEAR_HISTORY = 7;
    DELETE_CHAT = 8;     // личный чат и группа: удалить у себя (revoke — у всех)
    LEAVE = 9;           // выйти из группы или канала
    BLOCK = 10;
    UNBLOCK = 11;
  }
  PeerRef peer = 1;
  Kind kind = 2;
  bool revoke = 3;
}

message PeerList {
  repeated Peer peers = 1;
}

message Dialogs {
  repeated Dialog dialogs = 1;
  repeated Message messages = 2;  // последние сообщения диалогов
  repeated Peer peers = 3;
  int32 total = 4;
  bool complete = 5;              // больше страниц нет
}

message History {
  repeated Message messages = 1;  // от новых к старым
  repeated Peer peers = 2;
  int32 total = 3;
  int32 next_rate = 4;            // глобальный поиск: offset_rate следующей страницы (0 — конец)
}

message Sent {
  Message message = 1;
}

message FilePath {
  string path = 1;
}

message Countries {
  repeated Country countries = 1;
}

message Country {
  string iso2 = 1;
  string name = 2;           // на языке запроса
  string default_name = 3;   // английское
  repeated CountryCode codes = 4;
}

message CountryCode {
  string code = 1;               // код набора без «+»
  repeated string prefixes = 2;
  repeated string patterns = 3;  // маски вида "XXX XXX XXXX"
}

message ProxyCheck {
  uint32 rtt_ms = 1;
}

// Единая ошибка, см. правило 4 в заметке о стыках.
message Error {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    NETWORK = 1;
    RPC = 2;
    FLOOD = 3;
    AUTH = 4;
    CANCELLED = 5;
    INTERNAL = 6;
  }
  Kind kind = 1;
  int32 code = 2;
  string text = 3;
  uint32 retry_after = 4;
}

message FatalError {
  string text = 1;
}

message Ping {
  string message = 1;
}

message Pong {
  string message = 1;       // эхо Ping.message
  string core_version = 2;  // tg_version() из ядра, получено через Go
}

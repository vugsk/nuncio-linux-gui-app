[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
domain = { version = "0.1.0", path = "../domain" }
png = { version = "0.18.1", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "compat-1-2",
] }
zune-jpeg = "0.5.15"

[build-dependencies]
harfrust = "0.13.3"
png = "0.18.1"
skrifa = "0.47.0"
slint-build = "1"

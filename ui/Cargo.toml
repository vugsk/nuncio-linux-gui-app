[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
player = { path = "../player", version = "0.1.0" }
toml = "1.1.6"
domain = { version = "0.1.0", path = "../domain" }
harfrust = "0.13.3"
log = "0.4.34"
memmap2 = "0.9.11"
png = { version = "0.18.1", default-features = false }
image-webp = "0.2.4"
flate2 = "1.1.10"
qrcode = { version = "0.14.1", default-features = false }
skrifa = "0.47.0"
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "renderer-skia-opengl",
    "software-renderer-systemfonts",
    "compat-1-2",
    "unstable-winit-030",
] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
zune-jpeg = "0.5.15"

[build-dependencies]
emojis = "0.9.0"
harfrust = "0.13.3"
png = "0.18.1"
skrifa = "0.47.0"
slint-build = "1"
